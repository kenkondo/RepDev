<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepDev NG</title>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
      #app { display: flex; flex-direction: column; height: 100%; }
      #toolbar { display: flex; gap: 6px; padding: 6px; align-items: center; background: #1e1e1e; color: #ddd; flex-wrap: wrap; }
      #toolbar input { background: #2d2d2d; color: #eee; border: 1px solid #444; padding: 3px 5px; }
      #toolbar input[type='number'] { width: 70px; }
      #toolbar button { background: #0e639c; color: #fff; border: none; padding: 4px 10px; cursor: pointer; }
      #toolbar button:hover { background: #1177bb; }
      #status { margin-left: auto; font-size: 12px; color: #9cdcfe; }
      #editor { flex: 1; min-height: 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <input id="server" placeholder="server" value="" />
        <input id="port" type="number" placeholder="port" value="23" />
        <input id="aixUser" placeholder="AIX user" />
        <input id="aixPass" type="password" placeholder="AIX pass" />
        <input id="sym" type="number" placeholder="sym" value="999" />
        <input id="userId" placeholder="user id" />
        <button id="connect">Connect</button>
        <input id="fileName" placeholder="REPGEN name" />
        <button id="open">Open</button>
        <button id="save">Save + Check</button>
        <button id="install">Save + Install</button>
        <button id="diff">Diff vs Git</button>
        <span id="status">Disconnected</span>
      </div>
      <div id="editor"></div>
      <div id="diff-overlay" style="display:none; position:absolute; inset:40px; border:2px solid #0e639c; background:#1e1e1e;">
        <button id="diff-close" style="position:absolute; right:4px; top:4px; z-index:2;">Close</button>
        <div id="diff-editor" style="position:absolute; inset:0;"></div>
      </div>
    </div>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
